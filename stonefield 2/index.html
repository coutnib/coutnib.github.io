<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stonefield</title>
  <!-- Sends visitors to the game file. Query string and hash are kept. -->
  <meta http-equiv="refresh" content="0; url=stonefield.html">
  <link rel="canonical" href="stonefield.html">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛏️</text></svg>">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0f1412; color: #f2eedf;
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      text-align: center; padding: 16px;
    }
    h1 { font-size: clamp(2rem, 8vw, 3rem); margin: 0 0 12px; color: #8fc46a; }
    p { color: #b9b4a2; margin: 0 0 20px; }
    a {
      display: inline-block; padding: 10px 22px; border-radius: 6px;
      background: #8fc46a; color: #0f1412; text-decoration: none; font-weight: 700;
    }
    a:focus-visible { outline: 3px solid #e7b956; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Stonefield</h1>
    <p>Loading the world…</p>
    <a href="stonefield.html" id="play">Play now</a>
  </main>
  <script>
    location.replace("stonefield.html" + location.search + location.hash);
  </script>
</body>
</html>
